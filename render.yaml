services:
  # FastAPI Backend Service
  - type: web
    name: driftt-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driftt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: driftt-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_USER_EMAIL
        value: demo@driftt.app
      - key: DEMO_USER_PASSWORD
        value: demo123
      - key: ENABLE_LLM
        value: "true"

  # Frontend Web Service (Nginx container serving React SPA & reverse proxy)
  - type: web
    name: driftt-frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          type: web
          name: driftt-backend
          property: hostport

  # Key Value (Redis/Valkey cache)
  - type: keyvalue
    name: driftt-redis
    plan: free
    ipAllowList: []

databases:
  # Managed PostgreSQL
  - name: driftt-postgres
    databaseName: driftt
    user: driftt
    plan: free

